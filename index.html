<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before the Last Archive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial;color:#111}.app{max-width:620px;margin:auto;padding:18px 12px}.head{background:#111;color:#fff;border-radius:12px;padding:18px;margin-bottom:12px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:#aaa;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;padding:11px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}.tab.active{background:#111;color:#fff}.stats{display:flex;justify-content:space-between;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px}.list{display:flex;flex-direction:column;gap:7px}.chapter{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}.chapter input{width:20px;height:20px}.info{flex:1}.num{font-weight:bold}.date{font-size:13px;color:#666;margin-top:3px}.time{font-size:11px;color:#999;margin-top:2px}.done{opacity:.5}.done .num{text-decoration:line-through}.launch{border-left:4px solid #111}.rest{color:#aaa}.add{width:100%;margin-top:12px;padding:12px;border:1px dashed #999;background:#fff;border-radius:9px;cursor:pointer}.reset{width:100%;margin-top:7px;padding:10px;border:0;background:#111;color:#fff;border-radius:9px;cursor:pointer}.note{font-size:11px;color:#888;margin:10px 2px}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<div class="head"><h1>Before the Last Archive</h1><p>Publishing Checklist</p></div>

<div class="tabs">
<button class="tab active" onclick="setPage('webnovel',this)">Webnovel</button>
<button class="tab" onclick="setPage('royalroad',this)">Royal Road</button>
<button class="tab" onclick="setPage('patreon',this)">Patreon</button>
</div>

<div class="stats">
<span id="count">0 / 100 scheduled</span>
<span id="percent">0%</span>
</div>

<div id="list" class="list"></div>

<button class="add" onclick="addChapter()">+ Add 1 Chapter</button>
<button class="reset" onclick="resetData()">Reset</button>
<div class="note">Checkbox = chapter uploaded/scheduled for its assigned release date.</div>
</div>

<script>
const KEY="BTA_TRACKER_V3",START=new Date(2026,8,27);
let d=JSON.parse(localStorage.getItem(KEY))||{chapters:[]},page="webnovel";

function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function fmt(x){return x.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}

function nextDate(prev){
 let x=new Date(prev);x.setDate(x.getDate()+1);
 while(x.getDay()==0||x.getDay()==6)x.setDate(x.getDate()+1);
 return x
}

function make(n,date){
 return{n,date:date.toISOString().slice(0,10),time:"15:14",done:{webnovel:false,royalroad:false,patreon:false}}
}

if(!d.chapters.length){
 for(let i=1;i<=100;i++){
  let date;
  if(i<=5)date=new Date(2026,8,27);
  else date=nextDate(new Date(d.chapters[i-2].date+"T00:00:00"));
  d.chapters.push(make(i,date))
 }
 save()
}

function setPage(p,b){
 page=p;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render()
}

function render(){
 let list=document.getElementById("list");list.innerHTML="";
 let done=0;

 d.chapters.forEach(c=>{
  if(c.done[page])done++;
  let row=document.createElement("div");
  row.className="chapter"+(c.done[page]?" done":"")+(c.n<=5?" launch":"");
  row.innerHTML=`<input type="checkbox" ${c.done[page]?"checked":""}>
  <div class="info"><div class="num">Chapter ${c.n}</div>
  <div class="date">${fmt(new Date(c.date+"T00:00:00"))}</div>
  <div class="time">${c.time} IST ${c.n<=5?"• LAUNCH":""}</div></div>`;
  row.querySelector("input").onchange=e=>{
   c.done[page]=e.target.checked;save();render()
  };
  list.appendChild(row)
 });

 document.getElementById("count").textContent=done+" / "+d.chapters.length+" scheduled";
 document.getElementById("percent").textContent=Math.round(done/d.chapters.length*100)+"%";
}

function addChapter(){
 let last=d.chapters[d.chapters.length-1];
 let date=nextDate(new Date(last.date+"T00:00:00"));
 let n=last.n+1;
 d.chapters.push(make(n,date));
 save();render();
}

function resetData(){
 if(confirm("Reset all saved progress?")){
  localStorage.removeItem(KEY);location.reload()
 }
}

render();
</script>
</body>
</html>
